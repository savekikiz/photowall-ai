<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhotoWall — จอใหญ่</title>
<link rel="stylesheet" href="/app.css">
<style>
  body{overflow:hidden}
  .stage{height:100vh;display:flex;flex-direction:column}
  .bar{display:flex;align-items:center;gap:16px;padding:14px 26px;border-bottom:1px solid var(--line);
       background:rgba(13,15,26,.7);backdrop-filter:blur(8px)}
  .bar h1{font-size:1.5rem}
  .bar .spacer{flex:1}
  .bar .join{text-align:right;font-size:.95rem;color:var(--muted)}
  .bar .join b{color:var(--text);font-size:1.1rem}
  .board{flex:1;overflow:hidden;padding:18px 26px}
  .board .grid{height:100%;grid-template-columns:repeat(var(--cols,4),minmax(0,1fr));
                grid-auto-rows:minmax(0,1fr);gap:18px}
  .tile{display:flex;flex-direction:column;min-height:0}
  .tile img{flex:1;min-height:0;width:100%;height:auto;aspect-ratio:auto;object-fit:contain;padding:6px}
  .tile .meta{font-size:1rem;text-align:center}
  .tile{animation:pop .5s ease}
  .tile.fresh{box-shadow:0 0 0 3px var(--accent),0 0 40px rgba(124,108,255,.5)}
  @keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  .empty{display:flex;height:100%;align-items:center;justify-content:center;flex-direction:column;color:var(--muted)}
  .empty div:first-child{font-size:4rem}
</style>
</head>
<body>
<div class="stage">
  <div class="bar">
    <h1 id="title">PhotoWall</h1>
    <span class="pill" id="count">0 ภาพ</span>
    <div class="spacer"></div>
    <div class="join">สแกน QR หรือเปิดลิงก์<br><b id="joinurl"></b></div>
  </div>
  <div class="board">
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty"><div>📸</div><div>รอภาพแรกจากผู้เข้าร่วม…</div></div>
  </div>
</div>
<script>
const slug = new URLSearchParams(location.search).get('c') || '';
const $ = id => document.getElementById(id);
let seen = new Set(), first = true;

$('joinurl').textContent = location.origin + '/c/' + slug;

async function loadCampaign(){
  try {
    const r = await fetch('/api/campaigns/' + encodeURIComponent(slug));
    if (r.ok) { const { campaign } = await r.json(); $('title').textContent = campaign.title; }
    else $('title').textContent = 'ไม่พบงาน: ' + slug;
  } catch (e) {}
}

async function refresh(){
  if (!slug) { $('title').textContent = 'ใส่ ?c=ชื่องาน ใน URL ด้วย'; return; }
  try {
    const { submissions } = await (await fetch('/api/submissions?campaign=' + encodeURIComponent(slug))).json();
    $('count').textContent = submissions.length + ' ภาพ';
    $('empty').hidden = submissions.length > 0;
    const shown = submissions.slice(0, 24);
    // scale tiles so a handful of posters still fill the projector
    $('grid').style.setProperty('--cols', Math.min(6, Math.max(1, Math.ceil(Math.sqrt(shown.length * 1.6)))));
    $('grid').innerHTML = shown.map(s => {
      const fresh = !first && !seen.has(s.id);
      return `<div class="tile ${fresh ? 'fresh' : ''}">
        <img src="${s.imageUrl}" alt="">
        <div class="meta"><b>${esc(s.student_name) || 'ไม่ระบุชื่อ'}</b></div></div>`;
    }).join('');
    shown.forEach(s => seen.add(s.id));
    first = false;
  } catch (e) {}
}
const esc = s => (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
loadCampaign(); refresh(); setInterval(refresh, 8000);
</script>
</body>
</html>
